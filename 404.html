<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mengalihkan… — EduPortal LMS</title>
<!--
  GitHub Pages menyajikan berkas ini untuk setiap alamat yang tidak cocok
  dengan berkas mana pun. EduPortal adalah SPA dengan satu titik masuk dan
  tidak pernah mengubah URL saat berpindah halaman, sehingga halaman ini
  hanya tersentuh bila seseorang mengetik alamat yang keliru atau membuka
  tautan lama. Alih-alih menampilkan galat 404 GitHub yang membingungkan,
  pengguna dikembalikan ke aplikasi.
-->
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f8f9ff;color:#0b1c30;
       font:15px/1.6 'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;text-align:center;padding:24px}
  @media (prefers-color-scheme:dark){body{background:#0a1626;color:#e6eefc}}
  .mark{width:60px;height:60px;border-radius:14px;background:#022448;color:#feae2c;
        display:grid;place-items:center;margin:0 auto 18px}
  h1{font-size:20px;margin:0 0 6px;letter-spacing:-.01em}
  p{margin:0 0 18px;opacity:.75;font-size:14px;max-width:380px}
  a{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 20px;border-radius:8px;
    background:#022448;color:#fff;text-decoration:none;font-weight:600;font-size:14px}
  @media (prefers-color-scheme:dark){a{background:#adc8f5;color:#002c55}}
</style>
</head>
<body>
  <div>
    <div class="mark">
      <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor"
           stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 10 12 5 2 10l10 5 10-5Z"/><path d="M6 12v5c0 1.7 2.7 3 6 3s6-1.3 6-3v-5"/>
      </svg>
    </div>
    <h1>Halaman tidak ditemukan</h1>
    <p>Alamat yang Anda buka tidak ada. EduPortal bekerja dari satu alamat utama —
       silakan kembali ke portal.</p>
    <a href="./">Kembali ke EduPortal</a>
  </div>
  <script>
    /* Alihkan otomatis setelah 2,5 detik agar pengguna tidak perlu menekan apa pun. */
    setTimeout(function () { location.replace('./'); }, 2500);
  </script>
</body>
</html>
